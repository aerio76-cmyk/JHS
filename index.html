<!DOCTYPE html>
<html lang="zh-Hant">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>成長記錄本</title>
<link rel="stylesheet" href="css/style.css" />
<link rel="preconnect" href="https://fonts.googleapis.com" />
<link href="https://fonts.googleapis.com/css2?family=Noto+Serif+TC:wght@600;700&family=Noto+Sans+TC:wght@400;500;700&family=IBM+Plex+Mono:wght@400;600&family=Patrick+Hand&display=swap" rel="stylesheet" />
</head>
<body>
  <div class="page-head">
    <span class="eyebrow-tag">成長記錄・GROWTH LOG</span>
    <h1 class="page-title">學習成長手帳</h1>
    <p class="page-subtitle">跟自己比，每一次段考都是一頁新的紀錄</p>
  </div>

  <header class="site-header">
    <div class="student-tabs" id="studentTabs"></div>
    <div class="section-tabs" id="sectionTabs">
      <button class="section-tab is-active" data-section="home">首頁</button>
      <button class="section-tab" data-section="growth">成長圖表</button>
      <button class="section-tab" data-section="history">歷史紀錄</button>
    </div>
  </header>

  <main>
    <section class="card hero-quote" id="heroQuote" data-tab="home" data-col="full">
      <div class="speech-bubble" id="speechBubble">…</div>
    </section>

    <section class="card" data-tab="growth" data-col="main">
      <h2>成長曲線</h2>
      <canvas id="growthChart" height="220"></canvas>
    </section>

    <section class="card" data-tab="growth" data-col="main">
      <h2>科目走勢</h2>
      <div class="student-tabs" id="subjectTabs" style="margin-bottom:12px;"></div>
      <canvas id="subjectChart" height="220"></canvas>
    </section>

    <section class="card" data-tab="growth" data-col="aside">
      <h2>學期比較</h2>
      <div class="compare-grid" id="compareGrid"></div>
    </section>

    <section class="card" id="rankCard" data-tab="growth" data-col="aside" hidden>
      <h2>校排名次</h2>
      <div id="rankDisplay"></div>
    </section>

    <section class="card" data-tab="history" data-col="full">
      <h2>歷史紀錄</h2>

      <div id="examHistoryPanel">
        <div style="overflow-x:auto;">
          <table id="historyTable">
            <thead>
              <tr><th>段考</th><th>科目</th><th>分數</th><th>判定</th></tr>
            </thead>
            <tbody id="historyTableRecent"></tbody>
            <tbody id="historyTableOlder" hidden></tbody>
          </table>
        </div>
        <button class="btn-secondary" id="showMoreExamBtn" style="margin-top:12px;" hidden>顯示更早的歷史紀錄</button>
      </div>
    </section>
  </main>

  <footer class="site-footer">
    <a href="entry.html" class="entry-link" title="家長輸入">✏️</a>
  </footer>

  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.117.2/dist/umd/supabase.js" defer></script>
  <script src="https://cdn.jsdelivr.net/npm/chart.js@4.4.6/dist/chart.umd.js" defer></script>
  <script src="js/config.js" defer></script>
  <script src="js/supabaseClient.js" defer></script>
  <script src="js/stats.js" defer></script>
  <script src="js/dashboard.js" defer></script>
</body>
</html>
