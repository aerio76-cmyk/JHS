<!DOCTYPE html>
<html lang="zh-Hant">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>成長記錄本</title>
<link rel="stylesheet" href="css/style.css" />
<link rel="preconnect" href="https://fonts.googleapis.com" />
<link href="https://fonts.googleapis.com/css2?family=Patrick+Hand&family=Nunito:wght@400;700;800&display=swap" rel="stylesheet" />
</head>
<body>
  <header class="site-header">
    <div class="student-tabs" id="studentTabs"></div>
  </header>

  <main>
    <section class="card hero-companion" id="heroCompanion">
      <img class="companion-illustration" id="companionImg" src="" alt="成長夥伴" />
      <div class="speech-bubble" id="speechBubble">…</div>
    </section>

    <section class="card">
      <h2>成長曲線</h2>
      <canvas id="growthChart" height="220"></canvas>
    </section>

    <section class="card">
      <h2>成長徽章</h2>
      <div class="badge-grid" id="badgeGrid"></div>
    </section>

    <section class="card">
      <h2>科目走勢</h2>
      <div class="student-tabs" id="subjectTabs" style="margin-bottom:12px;"></div>
      <canvas id="subjectChart" height="220"></canvas>
    </section>

    <section class="card">
      <h2>學期比較</h2>
      <div class="compare-grid" id="compareGrid"></div>
    </section>

    <section class="card" id="rankCard" hidden>
      <h2>校排名次</h2>
      <div id="rankDisplay"></div>
    </section>

    <section class="card">
      <h2>歷史紀錄</h2>
      <div style="overflow-x:auto;">
        <table id="historyTable"></table>
      </div>
    </section>
  </main>

  <footer class="site-footer">
    <a href="entry.html" class="entry-link" title="家長輸入">✏️</a>
  </footer>

  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2" defer></script>
  <script src="https://cdn.jsdelivr.net/npm/chart.js@4" defer></script>
  <script src="js/config.js" defer></script>
  <script src="js/supabaseClient.js" defer></script>
  <script src="js/stats.js" defer></script>
  <script src="js/dashboard.js" defer></script>
</body>
</html>
